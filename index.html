<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rymal Variety - Employee Attendance</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Employee Attendance Tracking System for Rymal Variety">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rymal Attendance">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon-152.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rymal Variety</h1>
            <h2>Employee Attendance System</h2>
            <div id="currentDate"></div>
        </header>

        <main>
            <!-- Add Employee Section -->
            <section class="add-employee-section">
                <h3>Add New Employee</h3>
                <div class="add-employee-form">
                    <input type="text" id="newEmployeeName" placeholder="Enter employee name">
                    <button onclick="addEmployee()" class="btn-add">Add Employee</button>
                </div>
                <div id="addMessage" class="message"></div>
            </section>

            <!-- Attendance Section -->
            <section class="attendance-section">
                <h3>Mark Attendance</h3>
                <div id="employeeList" class="employee-list"></div>
            </section>

            <!-- Summary Section -->
            <section class="summary-section">
                <h3>Today's Summary</h3>
                <div id="summary" class="summary">
                    <div class="summary-item">
                        <span>Total Employees:</span>
                        <span id="totalEmployees">0</span>
                    </div>
                    <div class="summary-item">
                        <span>Present:</span>
                        <span id="presentCount" class="present-text">0</span>
                    </div>
                    <div class="summary-item">
                        <span>Absent:</span>
                        <span id="absentCount" class="absent-text">0</span>
                    </div>
                    <div class="summary-item">
                        <span>Not Marked:</span>
                        <span id="notMarkedCount">0</span>
                    </div>
                </div>
            </section>

            <!-- Attendance History -->
            <section class="history-section">
                <h3>Attendance History</h3>
                <div class="history-controls">
                    <input type="date" id="historyDate" onchange="loadHistory()">
                    <button onclick="clearAllData()" class="btn-clear">Clear All Data</button>
                </div>
                <div id="historyList" class="history-list"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Rymal Variety. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered successfully:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // Install prompt
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            // Show install button if you want to add one
            console.log('App can be installed');
        });

        window.addEventListener('appinstalled', () => {
            console.log('App installed successfully');
            deferredPrompt = null;
        });
    </script>
</body>
</html>
